<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進貨匯款查詢系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 主系統容器 -->
    <div class="glass-panel rounded-3xl w-full max-w-md p-6 relative overflow-hidden border border-white">
        <!-- 頂部裝飾條 -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 to-indigo-600"></div>

        <!-- 頂部標題與設定按鈕 -->
        <div class="flex justify-between items-center mb-6 mt-2">
            <div>
                <h1 class="text-2xl font-black text-gray-800 flex items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    庫存查詢系統
                </h1>
                <p id="syncTimeText" class="text-xs text-gray-400 mt-2 font-bold hidden"><i class="fa-solid fa-clock-rotate-left mr-1"></i>上次同步：<span id="syncTimeValue"></span></p>
            </div>
            <button onclick="toggleSettings()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-gray-200 text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-all shadow-sm">
                <i class="fa-solid fa-sliders text-lg"></i>
            </button>
        </div>

        <!-- 搜尋區域 -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" id="searchInput" 
                    class="w-full pl-12 pr-4 py-4 border-2 border-gray-100 rounded-2xl focus:ring-0 focus:border-indigo-500 outline-none transition-all text-lg font-bold shadow-inner bg-gray-50/50"
                    placeholder="輸入欲查詢的款號 (例如: 6700)"
                    onkeypress="handleKeyPress(event)">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                </div>
            </div>
            <button onclick="searchData()" 
                class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-2xl transition-all shadow-lg hover:shadow-indigo-500/30 flex justify-center items-center gap-2">
                <i class="fa-solid fa-bolt"></i> 立即查詢
            </button>
        </div>

        <!-- 狀態與結果顯示區 -->
        
        <!-- 1. 載入中 -->
        <div id="loadingState" class="hidden flex-col items-center justify-center py-8 text-gray-500 fade-in">
            <div class="relative w-12 h-12 mb-4">
                <div class="absolute inset-0 border-4 border-gray-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-500 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="font-bold text-gray-600 text-sm" id="loadingText">處理中...</p>
        </div>

        <!-- 2. 查無結果 -->
        <div id="noResultState" class="hidden fade-in text-center py-10 bg-gray-50 rounded-2xl border border-dashed border-gray-300">
            <div class="w-14 h-14 mx-auto bg-white shadow-sm rounded-full flex items-center justify-center mb-3 text-gray-300">
                <i class="fa-solid fa-ghost text-xl"></i>
            </div>
            <h3 class="text-gray-700 font-bold text-base mb-1">查無資料</h3>
            <p class="text-gray-400 text-xs px-4">找不到符合此關鍵字的紀錄</p>
        </div>

        <!-- 3. 結果列表 -->
        <div id="resultContainer" class="hidden fade-in w-full custom-scrollbar max-h-[50vh] overflow-y-auto pr-2 pb-2 space-y-4">
            <!-- 結果卡片會動態生成在這裡 -->
        </div>
    </div>

    <!-- 設定 Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-40 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl flex flex-col border border-gray-100 overflow-hidden transform transition-transform">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-database text-indigo-600"></i> 資料庫設定
                </h2>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-gray-700 bg-white w-8 h-8 rounded-full shadow-sm flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-6">
                <label class="block text-sm font-bold text-gray-600 mb-2">Google Apps Script API 網址</label>
                <textarea id="apiUrlInput" rows="3"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-xs bg-gray-50 font-mono text-gray-600 resize-none"
                    placeholder="https://script.google.com/macros/s/.../exec">https://script.google.com/macros/s/AKfycbyo0ZNM-8GnRqZvRkGYN_0TNNErpzYNDOiAmc3vnIJTvYcCH6fwrw6pYj7WZWF01GFV2Q/exec</textarea>
                
                <button onclick="fetchData()" class="mt-5 w-full py-3.5 bg-gray-900 hover:bg-black text-white rounded-xl transition-all shadow-md font-bold text-sm flex justify-center items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-down"></i> 載入資料 (Load Data)
                </button>
            </div>
            
            <div class="px-6 py-3 border-t border-gray-100 bg-gray-50 flex justify-between items-center text-xs">
                <span id="dbStatus" class="font-bold text-gray-500 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> 尚未載入資料
                </span>
            </div>
        </div>
    </div>

    <!-- 客製化 Alert Modal -->
    <div id="alertModal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
            <div id="alertIcon" class="mb-4 text-5xl"></div>
            <h3 id="alertTitle" class="text-lg font-black mb-2 text-gray-800"></h3>
            <p id="alertMessage" class="text-gray-500 mb-6 text-sm leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl transition-colors font-bold">確認</button>
        </div>
    </div>

    <script>
        // 系統狀態
        let globalData = {}; // 儲存所有試算表資料
        let isDataLoaded = false;

        // UI 輔助函數
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function showAlert(title, message, type = 'info') {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            
            const iconDiv = document.getElementById('alertIcon');
            if (type === 'error') {
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-500 drop-shadow-sm"></i>';
            } else if (type === 'success') {
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500 drop-shadow-sm"></i>';
            } else {
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-info text-blue-500 drop-shadow-sm"></i>';
            }
            
            document.getElementById('alertModal').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alertModal').classList.add('hidden');
        }

        function setStatus(text, colorClass) {
            const statusEl = document.getElementById('dbStatus');
            statusEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${colorClass}"></span> ${text}`;
        }

        function showLoading(text) {
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('noResultState').classList.add('hidden');
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingState').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') searchData();
        }

        // 核心邏輯：載入資料 (Fetch)
        async function fetchData() {
            const url = document.getElementById('apiUrlInput').value.trim();
            if (!url) {
                showAlert('發生錯誤', 'API 網址不能為空。', 'error');
                return;
            }

            toggleSettings();
            showLoading('正在從雲端載入資料...');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // 檢查是否為有效的物件格式
                if (typeof data !== 'object' || data === null) {
                    throw new Error('回傳格式錯誤');
                }

                globalData = data;
                isDataLoaded = true;
                
                // 將資料與當前時間存入 LocalStorage 供下次使用
                const now = new Date().toLocaleString('zh-TW', { hour12: false });
                localStorage.setItem('sheetData', JSON.stringify(data));
                localStorage.setItem('lastSyncTime', now);
                updateSyncTimeUI(now);

                // 計算總筆數 (扣除每個 sheet 的第一行標題)
                let totalRows = 0;
                for (const sheet in globalData) {
                    if (globalData[sheet].length > 1) {
                        totalRows += (globalData[sheet].length - 1);
                    }
                }

                hideLoading();
                setStatus(`已連線 (共 ${totalRows} 筆)`, 'bg-emerald-500 animate-pulse');
                showAlert('載入成功', `資料庫已成功同步！目前共載入 ${totalRows} 筆資料。`, 'success');

            } catch (error) {
                console.error("Fetch Error:", error);
                hideLoading();
                isDataLoaded = false;
                setStatus('連線失敗', 'bg-red-500');
                showAlert('連線失敗', '無法讀取 API 資料，請檢查網址是否正確，且 Apps Script 權限已設為「所有人」。', 'error');
            }
        }

        // 核心邏輯：全局搜尋 (Global Search)
        function searchData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!query) {
                showAlert('提示', '請輸入要查詢的內容！', 'info');
                return;
            }
            if (!isDataLoaded) {
                showAlert('尚未載入', '請先點擊右上角設定按鈕並載入資料庫。', 'info');
                return;
            }

            showLoading('搜尋中...');

            // 使用 setTimeout 讓 UI 有時間渲染 Loading 畫面
            setTimeout(() => {
                const results = [];

                // 遍歷所有的 Sheet
                for (const sheetName in globalData) {
                    const sheetData = globalData[sheetName];
                    if (!sheetData || sheetData.length < 2) continue; // 沒有資料或只有標題

                    const headers = sheetData[0]; // 第 0 列為標題

                    // 遍歷該 Sheet 的所有列 (從 1 開始)
                    for (let i = 1; i < sheetData.length; i++) {
                        const row = sheetData[i];
                        let matchFound = false;

                        // 檢查該列的所有儲存格
                        for (let j = 0; j < row.length; j++) {
                            const cellValue = String(row[j] || '').trim().toLowerCase();
                            // 支援部分匹配 (Partial match)
                            if (cellValue.includes(query)) {
                                matchFound = true;
                                break;
                            }
                        }

                        if (matchFound) {
                            // 整理要顯示的資料 (忽略空白欄位)
                            const rowDisplayData = [];
                            for (let j = 0; j < row.length; j++) {
                                const val = String(row[j] || '').trim();
                                if (val !== '') {
                                    const headerLabel = String(headers[j] || `欄位 ${j+1}`).trim();
                                    rowDisplayData.push({ label: headerLabel, value: val });
                                }
                            }
                            results.push({ sheet: sheetName, data: rowDisplayData });
                        }
                    }
                }

                renderResults(results);
            }, 300); // 些微延遲以展現過場動畫
        }

        // 介面渲染：顯示搜尋結果
        function renderResults(results) {
            hideLoading();
            const container = document.getElementById('resultContainer');
            const noResult = document.getElementById('noResultState');
            
            container.innerHTML = ''; // 清空舊結果

            if (results.length === 0) {
                noResult.classList.remove('hidden');
                container.classList.add('hidden');
                return;
            }

            noResult.classList.add('hidden');
            container.classList.remove('hidden');

            // 頂部統計
            const statsHtml = `
                <div class="flex justify-between items-center pb-2 sticky top-0 bg-white/90 backdrop-blur-sm z-10">
                    <span class="text-xs font-bold text-gray-400">搜尋結果</span>
                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md">找到 ${results.length} 筆</span>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', statsHtml);

            // 渲染每一個結果卡片
            results.forEach(res => {
                let cardHtml = `
                    <div class="bg-white border-2 border-gray-100 rounded-2xl p-4 shadow-sm relative group hover:border-indigo-100 transition-colors">
                        <!-- 分頁標籤 Badge -->
                        <div class="absolute -top-3 -right-2">
                            <span class="bg-gray-800 text-white text-[11px] font-bold px-3 py-1 rounded-full shadow-sm">
                                <i class="fa-regular fa-file-lines mr-1 opacity-70"></i>${res.sheet}
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 mt-2">
                `;

                res.data.forEach(item => {
                    cardHtml += `
                        <div class="bg-gray-50 rounded-xl p-2.5 border border-gray-100/50">
                            <div class="text-[10px] font-bold tracking-widest text-gray-400 mb-0.5 truncate">${item.label}</div>
                            <div class="text-sm font-bold text-gray-800 break-words">${item.value}</div>
                        </div>
                    `;
                });

                cardHtml += `
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // 介面渲染：更新上次同步時間
        function updateSyncTimeUI(timeStr) {
            const syncTextEl = document.getElementById('syncTimeText');
            const syncValueEl = document.getElementById('syncTimeValue');
            if (timeStr) {
                syncValueEl.textContent = timeStr;
                syncTextEl.classList.remove('hidden');
            }
        }

        // 初始化：網頁載入時檢查 LocalStorage 是否有快取資料
        window.addEventListener('DOMContentLoaded', () => {
            const cachedData = localStorage.getItem('sheetData');
            const cachedTime = localStorage.getItem('lastSyncTime');
            
            if (cachedData && cachedTime) {
                try {
                    globalData = JSON.parse(cachedData);
                    isDataLoaded = true;
                    updateSyncTimeUI(cachedTime);
                    
                    let totalRows = 0;
                    for (const sheet in globalData) {
                        if (globalData[sheet].length > 1) {
                            totalRows += (globalData[sheet].length - 1);
                        }
                    }
                    setStatus(`已從快取載入 (共 ${totalRows} 筆)`, 'bg-emerald-500');
                    // 有快取資料，無需開啟設定視窗，直接準備好可供搜尋
                } catch (e) {
                    console.error('快取解析失敗', e);
                    localStorage.removeItem('sheetData');
                    localStorage.removeItem('lastSyncTime');
                    setTimeout(() => toggleSettings(), 500); // 發生錯誤時開啟設定視窗
                }
            } else {
                // 如果是第一次使用 (沒有快取)，自動打開設定視窗提示載入
                setTimeout(() => toggleSettings(), 500);
            }
        });
    </script>
</body>
</html>
